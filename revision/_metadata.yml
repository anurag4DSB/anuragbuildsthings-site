css: revision.css
format:
  html:
    include-in-header:
      text: |
        <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
        <link rel="icon" type="image/png" sizes="192x192" href="/favicon-192.png">
        <link rel="apple-touch-icon" sizes="192x192" href="/favicon-192.png">
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Mono:wght@200..800&family=Fraunces:opsz,wght,ital@9..144,300..800,0..1&family=Inter+Tight:wght@300..700&family=JetBrains+Mono:wght@400..600&family=Newsreader:opsz,wght,ital@6..72,300..700,0..1&display=optional">
        <meta name="robots" content="noindex, nofollow">
        <meta name="theme-color" content="#0c0d0b">
        <link rel="manifest" href="manifest.webmanifest">
    include-after-body:
      text: |
        <script>
        (function () {
          var KEY = 'rev:known:';
          function store() { try { return window.localStorage; } catch (e) { return null; } }
          function known(id) { var s = store(); if (!s) return false; try { return s.getItem(KEY + id) === '1'; } catch (e) { return false; } }
          function setKnown(id, v) { var s = store(); if (!s) return; try { if (v) s.setItem(KEY + id, '1'); else s.removeItem(KEY + id); } catch (e) {} }
          function cards() { return Array.prototype.slice.call(document.querySelectorAll('details.rev')); }
          function say(msg) { var p = document.getElementById('rev-progress'); if (p) p.textContent = msg; }
          function paint() {
            var all = cards(), n = 0;
            all.forEach(function (d) {
              var id = d.getAttribute('data-card'), k = known(id);
              d.classList.toggle('is-known', k);
              var b = d.querySelector('.rev-known');
              if (b) b.textContent = k ? 'unmark' : 'mark known';
              if (k) n++;
            });
            say(all.length ? 'Known ' + n + ' of ' + all.length + '.' : '');
            document.querySelectorAll('section.level2 > h2').forEach(function (h) {
              var sec = h.parentNode, cs = sec.querySelectorAll('details.rev');
              if (!cs.length) return;
              var k = sec.querySelectorAll('details.rev.is-known').length;
              var span = h.querySelector('.rev-sec');
              if (!span) { span = document.createElement('span'); span.className = 'rev-sec'; h.appendChild(span); }
              span.textContent = k + ' of ' + cs.length + ' known';
            });
          }
          function nextUnknown() {
            var y = window.scrollY, open = cards().filter(function (d) { return d.open; });
            var list = cards().filter(function (d) { return !d.classList.contains('is-known'); });
            var d = null;
            for (var i = 0; i < list.length; i++) {
              var top = list[i].getBoundingClientRect().top + window.scrollY;
              if (top > y + 24 && open.indexOf(list[i]) < 0) { d = list[i]; break; }
            }
            if (!d) d = list[0];
            if (!d) { say('Every card on this page is marked known.'); return; }
            open.forEach(function (x) { x.open = false; });
            d.open = true;
            d.scrollIntoView({ block: 'start' });
          }
          function setAll(open) { cards().forEach(function (d) { d.open = open; }); }
          function exportMarks() {
            var ids = cards().filter(function (d) { return d.classList.contains('is-known'); }).map(function (d) { return d.getAttribute('data-card'); });
            var url = location.origin + location.pathname + '#marks=' + encodeURIComponent(ids.join(','));
            var done = function () { say('Link with ' + ids.length + ' marks copied. Open it in the other browser.'); };
            var show = function () { var p = document.getElementById('rev-progress'); if (p) { p.textContent = ''; var a = document.createElement('a'); a.href = url; a.textContent = 'marks link (' + ids.length + ')'; p.appendChild(a); } };
            if (navigator.share) { navigator.share({ title: 'Revision marks', url: url }).then(done, show); return; }
            if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(url).then(done, show); else show();
          }
          function importMarks() {
            var m = /[#&]marks=([^&]*)/.exec(location.hash);
            if (!m) return;
            var ids = decodeURIComponent(m[1]).split(',').filter(Boolean);
            ids.forEach(function (id) { setKnown(id, true); });
            try { history.replaceState(null, '', location.pathname); } catch (e) {}
          }
          document.addEventListener('click', function (e) {
            var b = e.target.closest && e.target.closest('.rev-known');
            if (b) { var id = b.getAttribute('data-for'); setKnown(id, !known(id)); paint(); return; }
            var cl = e.target.closest && e.target.closest('.rev-close');
            if (cl) { var dd = cl.closest('details.rev'); dd.open = false; dd.scrollIntoView({ block: 'start' }); return; }
            var t = e.target.closest && e.target.closest('[data-rev]');
            if (!t) return;
            var a = t.getAttribute('data-rev');
            if (a === 'next') nextUnknown();
            else if (a === 'expand') setAll(true);
            else if (a === 'collapse') setAll(false);
            else if (a === 'export') exportMarks();
            else if (a === 'reset') { cards().forEach(function (d) { setKnown(d.getAttribute('data-card'), false); }); paint(); }
          });
          document.addEventListener('keydown', function (e) {
            if (e.target && /INPUT|TEXTAREA|SELECT/.test(e.target.tagName)) return;
            if (e.key === 'j') nextUnknown();
          });
          if ('serviceWorker' in navigator) { try { navigator.serviceWorker.register('sw.js'); } catch (e) {} }
          function stackTables() {
            document.querySelectorAll('main table').forEach(function (t) {
              var heads = Array.prototype.map.call(t.querySelectorAll('thead th'), function (th) { return th.textContent.trim(); });
              if (heads.length < 4) return;
              t.classList.add('rev-stack');
              t.querySelectorAll('tbody tr').forEach(function (tr) {
                Array.prototype.forEach.call(tr.cells, function (td, j) { td.setAttribute('data-label', heads[j] || ''); });
              });
            });
          }
          function wrapLines() {
            document.querySelectorAll('.rev-a pre > code').forEach(function (c) {
              if (c.querySelector('.ln')) return;
              var lines = c.textContent.replace(/\n$/, '').split('\n'); c.textContent = '';
              lines.forEach(function (l) { var sp = document.createElement('span'); sp.className = 'ln'; sp.textContent = l; c.appendChild(sp); });
            });
          }
          function closeButtons() {
            document.querySelectorAll('.rev-actions').forEach(function (p) {
              if (p.querySelector('.rev-close')) return;
              var b = document.createElement('button'); b.type = 'button'; b.className = 'rev-close'; b.textContent = 'close'; p.appendChild(b);
            });
          }
          function diagrams() {
            document.querySelectorAll('.cell-output-display svg.flowchart').forEach(function (svg) {
              var vb = svg.viewBox.baseVal;
              if (window.innerWidth < 600 && vb && vb.width) svg.style.width = Math.round(vb.width * 0.6) + 'px';
              var a = document.createElement('a'); a.className = 'rev-full'; a.href = '#'; a.textContent = 'open full size';
              a.addEventListener('click', function (e) {
                e.preventDefault(); var c = svg.cloneNode(true);
                c.setAttribute('width', Math.round(vb.width)); c.setAttribute('height', Math.round(vb.height)); c.removeAttribute('style');
                window.open(URL.createObjectURL(new Blob(['<!doctype html><meta name="viewport" content="width=device-width"><body style="margin:0;background:#0c0d0b">' + c.outerHTML], { type: 'text/html' })));
              });
              var host = svg.closest('.cell-output-display'); if (host) host.before(a);
            });
          }
          function init() { importMarks(); stackTables(); wrapLines(); closeButtons(); paint(); setTimeout(diagrams, 800); }
          if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init); else init();
        })();
        </script>
