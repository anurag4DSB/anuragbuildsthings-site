<!doctype html>
<!-- @dsCard group="Brand" name="Brand · Iconography" subtitle="Bootstrap Icons + unicode glyphs in use" viewport="700x200" --><html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"><style>
body { padding: 24px 28px; }
.note { font-family: var(--mono); font-size: 10px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--ink-3); margin-bottom: 14px; }
.icons { display: flex; gap: 22px; align-items: center; }
.ic { display: flex; flex-direction: column; gap: 6px; align-items: center; color: var(--ink-2); transition: color 120ms; cursor: pointer; }
.ic i { font-size: 22px; line-height: 1; }
.ic .nm { font-family: var(--mono); font-size: 9px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--ink-3); }
.ic:hover { color: #c8e25c; }
.ic.yt:hover { color: #FF0000; } .ic.li:hover { color: #0A66C2; } .ic.git:hover { color: #ecece4; }
.glyphs { display: flex; gap: 22px; align-items: baseline; margin-top: 12px; padding-top: 14px; border-top: 1px solid var(--rule); font-family: 'JetBrains Mono', monospace; }
.gl { color: var(--ink-2); font-size: 18px; }
.gl .lbl { font-family: var(--mono); font-size: 9px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--ink-3); margin-left: 8px; }
</style></head><body>
<div class="note">Iconography · Bootstrap Icons (outline) · hover swaps to signal · social-brand exception</div>
<div class="icons">
  <div class="ic git"><i class="bi bi-git"></i><span class="nm">git</span></div>
  <div class="ic yt"><i class="bi bi-youtube"></i><span class="nm">youtube</span></div>
  <div class="ic li"><i class="bi bi-linkedin"></i><span class="nm">linkedin</span></div>
  <div class="ic"><i class="bi bi-rss"></i><span class="nm">rss</span></div>
  <div class="ic"><i class="bi bi-search"></i><span class="nm">search</span></div>
  <div class="ic"><i class="bi bi-envelope-fill"></i><span class="nm">email</span></div>
</div>
<div class="glyphs">
  <span class="gl">←<span class="lbl">prev</span></span>
  <span class="gl">→<span class="lbl">next</span></span>
  <span class="gl">⬆<span class="lbl">to top</span></span>
  <span class="gl">¶<span class="lbl">post</span></span>
  <span class="gl">§<span class="lbl">section</span></span>
  <span class="gl">⌘<span class="lbl">action</span></span>
</div>
</body></html>
