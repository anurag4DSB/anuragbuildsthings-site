<!doctype html>
<!-- @dsCard group="Spacing" name="Spacing · Tokens" subtitle="Borders, radius (always 0), motion, frame" viewport="700x320" --><html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"><style>
body { padding: 22px 26px; }
.grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
.tok { padding: 12px; border: 1px solid var(--rule); display: flex; flex-direction: column; gap: 8px; }
.swatch { height: 36px; background: var(--paper-up); border: 1px solid var(--rule); }
.nm { font-family: var(--mono); font-size: 10px; letter-spacing: 0.06em; color: var(--ink-2); text-transform: uppercase; }
.val { font-family: var(--mono); font-size: 11px; color: var(--ink); }
.note { font-family: var(--mono); font-size: 9px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--ink-3); margin-bottom: 10px; }
.bw { display: flex; align-items: stretch; height: 36px; border: 1px solid var(--rule); }
.bw > div { flex: 1; background: var(--paper-up); }
.bw > div + div { border-left: 1px solid var(--rule); }
.bw .hi { border-color: var(--rule-hi) !important; }
.demo-radius { width: 36px; height: 36px; background: #c8e25c; }
</style></head><body>
<div class="note">Spacing · borders · radius · motion</div>
<div class="grid">
  <div class="tok"><div class="bw"><div></div><div></div></div><div class="nm">rule · 1px</div><div class="val">#22251f</div></div>
  <div class="tok"><div class="bw"><div class="hi" style="border-right:1px solid #32362f"></div><div></div></div><div class="nm">rule-hi · 1px</div><div class="val">#32362f</div></div>
  <div class="tok"><div class="demo-radius"></div><div class="nm">radius</div><div class="val">0 (always)</div></div>
  <div class="tok"><div class="swatch" style="display:flex;align-items:center;justify-content:center;color:#5e635c;font-family:var(--mono);font-size:10px">no shadow</div><div class="nm">elevation</div><div class="val">via paper-up</div></div>
</div>
<div class="grid" style="margin-top:12px">
  <div class="tok"><div class="nm">dur-fast</div><div class="val">120ms ease</div><div class="nm" style="color:#5e635c">hover swaps</div></div>
  <div class="tok"><div class="nm">dur-mid</div><div class="val">180ms ease</div><div class="nm" style="color:#5e635c">dock fade</div></div>
  <div class="tok"><div class="nm">frame-max</div><div class="val">75rem · 1200px</div><div class="nm" style="color:#5e635c">page width</div></div>
  <div class="tok"><div class="nm">gutter</div><div class="val">1.5rem · 24px</div><div class="nm" style="color:#5e635c">side padding</div></div>
</div>
</body></html>
