<!doctype html>
<!-- @dsCard group="Components" name="Components · Buttons & Links" subtitle="Text link, category chip, mono ghost button" viewport="700x130" --><html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"><style>
body { padding: 22px 26px; }
.row { display: flex; gap: 18px; align-items: stretch; }
.btn-link { color: #c8e25c; text-decoration: none; border-bottom: 1px solid rgba(200,226,92,0.3); font-family: 'Newsreader', serif; font-size: 17px; padding-bottom: 1px; }
.btn-link:hover { border-bottom-color: #c8e25c; }
.chip { font-family: var(--mono); font-size: 9.5px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink-2); border: 1px solid var(--rule-hi); padding: 5px 12px; background: transparent; }
.chip.on { background: #c8e25c; color: #0c0d0b; border-color: #c8e25c; }
.btn-mono { font-family: var(--mono); font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink-2); background: var(--surface); border: 1px solid #3a3d36; padding: 8px 14px; }
.btn-mono:hover { color: #c8e25c; border-color: #c8e25c; }
.col { display: flex; flex-direction: column; gap: 8px; }
.lbl { font-family: var(--mono); font-size: 9.5px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--ink-3); margin-bottom: 6px; }
</style></head><body>
<div class="row">
  <div class="col"><div class="lbl">link · text</div><a href="#" class="btn-link">augmentations are the model</a></div>
  <div class="col"><div class="lbl">chip · default / on</div><div style="display:flex;gap:6px"><span class="chip">all</span><span class="chip on">ssl</span><span class="chip">notes</span></div></div>
  <div class="col"><div class="lbl">mono button</div><button class="btn-mono">⬆ BACK TO TOP</button></div>
</div>
</body></html>
