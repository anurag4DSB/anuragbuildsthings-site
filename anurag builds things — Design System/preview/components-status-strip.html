<!doctype html>
<!-- @dsCard group="Components" name="Components · Status Strip" subtitle="Currently · Last shipped · Cadence · Index" viewport="700x160" --><html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"><style>
body { padding: 22px 26px; }
.strip { display: grid; grid-template-columns: 1.4fr 1fr 1fr 1fr; gap: 24px; padding: 14px 0; border-top: 1px solid var(--rule); border-bottom: 1px solid var(--rule); }
.cell { display: grid; gap: 4px; }
.cell.right { justify-items: end; text-align: right; }
.lbl { font-family: var(--mono); font-size: 10px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--ink-3); display: inline-flex; align-items: center; gap: 8px; }
.val { font-family: 'Inter Tight', sans-serif; font-size: 14px; font-weight: 500; color: var(--ink); letter-spacing: -0.005em; }
.dot { display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: #c8e25c; box-shadow: 0 0 0 0 rgba(200,226,92,0.35); animation: ip 2s infinite cubic-bezier(.16,1,.3,1); }
@keyframes ip { 0%{box-shadow:0 0 0 0 rgba(200,226,92,.35)} 70%{box-shadow:0 0 0 6px rgba(200,226,92,0)} 100%{box-shadow:0 0 0 0 rgba(200,226,92,0)} }
.cap { font-family: var(--mono); font-size: 10px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--ink-3); margin-bottom: 12px; }
</style></head><body>
<div class="cap">Status strip · homepage frame</div>
<div class="strip">
  <div class="cell"><span class="lbl"><span class="dot"></span>CURRENTLY</span><span class="val">Linear probes on CIFAR-10</span></div>
  <div class="cell"><span class="lbl">LAST SHIPPED</span><span class="val">15 APR 2026</span></div>
  <div class="cell"><span class="lbl">CADENCE</span><span class="val">~2 / month</span></div>
  <div class="cell right"><span class="lbl">INDEX</span><span class="val">4 entries</span></div>
</div>
</body></html>
